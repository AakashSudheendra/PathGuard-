name: Collect Public Benchmark Candidates
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/collect-benchmark.yml"
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout PathGuard
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build PathGuard
        run: |
          npm ci
          npm run build
      - name: Checkout pinned Axios repository
        uses: actions/checkout@v4
        with:
          repository: axios/axios
          ref: v1.x
          path: targets/axios
          persist-credentials: false
      - name: Checkout pinned Undici repository
        uses: actions/checkout@v4
        with:
          repository: nodejs/undici
          ref: main
          path: targets/undici
          persist-credentials: false
      - name: Checkout pinned npm CLI repository
        uses: actions/checkout@v4
        with:
          repository: npm/cli
          ref: latest
          path: targets/npm-cli
          persist-credentials: false
      - name: Checkout pinned Marked repository
        uses: actions/checkout@v4
        with:
          repository: markedjs/marked
          ref: master
          path: targets/marked
          persist-credentials: false
      - name: Checkout pinned Yargs repository
        uses: actions/checkout@v4
        with:
          repository: yargs/yargs
          ref: main
          path: targets/yargs
          persist-credentials: false
      - name: Checkout pinned Node-RED repository
        uses: actions/checkout@v4
        with:
          repository: node-red/node-red
          ref: main
          path: targets/node-red
          persist-credentials: false
      - name: Checkout pinned Parse Server repository
        uses: actions/checkout@v4
        with:
          repository: parse-community/parse-server
          ref: alpha
          path: targets/parse-server
          persist-credentials: false
      - name: Verify immutable source commits
        shell: bash
        run: |
          test "$(git -C targets/axios rev-parse HEAD)" = "1a94bdbdf0518f3adbeada510b747aff80847ed7"
          test "$(git -C targets/undici rev-parse HEAD)" = "e960331c83346ce770a7a58d7cfb6afb4aec0ccf"
          test "$(git -C targets/npm-cli rev-parse HEAD)" = "b317f16c80df02ea3628cfa77170d5ae9b59720c"
          test "$(git -C targets/marked rev-parse HEAD)" = "eaa1fffb30fa334cc11ab93f1e5aaa1d2b916e7c"
          test "$(git -C targets/yargs rev-parse HEAD)" = "b2dbcc538062829bd720f8cbfb6b4765bae6b4b8"
          test "$(git -C targets/node-red rev-parse HEAD)" = "935b8d3e12ec8be064f3a72ac6547131f778a7b1"
          test "$(git -C targets/parse-server rev-parse HEAD)" = "304c1a5d4e752958c7c9b41425fe1ee546111fc6"
      - name: Install pinned OSV-Scanner
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/research/osv-scanner-reports"
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 -o /tmp/osv-scanner_linux_amd64
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_SHA256SUMS -o /tmp/osv-scanner_SHA256SUMS
          grep 'osv-scanner_linux_amd64$' /tmp/osv-scanner_SHA256SUMS | (cd /tmp && sha256sum -c -)
          chmod +x /tmp/osv-scanner_linux_amd64
          /tmp/osv-scanner_linux_amd64 --version | tee "$GITHUB_WORKSPACE/research/osv-scanner-reports/tool-version.txt"
      - name: Scan Axios with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/axios/package-lock.json" --source "$GITHUB_WORKSPACE/targets/axios/lib" --repo-url "https://github.com/axios/axios" --commit "1a94bdbdf0518f3adbeada510b747aff80847ed7" --out "$GITHUB_WORKSPACE/research/scan-reports/axios.json" --limit 2000
      - name: Scan Undici with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/undici/package-lock.json" --source "$GITHUB_WORKSPACE/targets/undici/lib" --repo-url "https://github.com/nodejs/undici" --commit "e960331c83346ce770a7a58d7cfb6afb4aec0ccf" --out "$GITHUB_WORKSPACE/research/scan-reports/undici.json" --limit 2000
      - name: Scan npm CLI with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/npm-cli/package-lock.json" --source "$GITHUB_WORKSPACE/targets/npm-cli/lib" --repo-url "https://github.com/npm/cli" --commit "b317f16c80df02ea3628cfa77170d5ae9b59720c" --out "$GITHUB_WORKSPACE/research/scan-reports/npm-cli.json" --limit 2000
      - name: Scan Marked with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/marked/package-lock.json" --source "$GITHUB_WORKSPACE/targets/marked/src" --repo-url "https://github.com/markedjs/marked" --commit "eaa1fffb30fa334cc11ab93f1e5aaa1d2b916e7c" --out "$GITHUB_WORKSPACE/research/scan-reports/marked.json" --limit 2000
      - name: Scan Yargs with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/yargs/package-lock.json" --source "$GITHUB_WORKSPACE/targets/yargs/lib" --repo-url "https://github.com/yargs/yargs" --commit "b2dbcc538062829bd720f8cbfb6b4765bae6b4b8" --out "$GITHUB_WORKSPACE/research/scan-reports/yargs.json" --limit 2000
      - name: Scan Node-RED with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/node-red/package-lock.json" --source "$GITHUB_WORKSPACE/targets/node-red/packages" --repo-url "https://github.com/node-red/node-red" --commit "935b8d3e12ec8be064f3a72ac6547131f778a7b1" --out "$GITHUB_WORKSPACE/research/scan-reports/node-red.json" --limit 3000
      - name: Scan Parse Server with PathGuard
        run: npm run scan -- --lockfile "$GITHUB_WORKSPACE/targets/parse-server/package-lock.json" --source "$GITHUB_WORKSPACE/targets/parse-server/src" --repo-url "https://github.com/parse-community/parse-server" --commit "304c1a5d4e752958c7c9b41425fe1ee546111fc6" --out "$GITHUB_WORKSPACE/research/scan-reports/parse-server.json" --limit 3000
      - name: Run OSV-Scanner baseline on pinned lockfiles
        shell: bash
        run: |
          set -euo pipefail
          scan_osv() {
            local slug="$1" repo="$2" commit="$3" lockfile="$4"
            local report="$GITHUB_WORKSPACE/research/osv-scanner-reports/$slug.osv.json"
            local stderr_file="$GITHUB_WORKSPACE/research/osv-scanner-reports/$slug.stderr.log"
            local exit_code=0
            set +e
            /tmp/osv-scanner_linux_amd64 scan --format json -L "$lockfile" > "$report" 2> "$stderr_file"
            exit_code=$?
            set -e
            if [ "$exit_code" -gt 1 ]; then
              echo "OSV-Scanner failed for $slug with exit code $exit_code" >&2
              cat "$stderr_file" >&2
              exit "$exit_code"
            fi
            printf '{"repositoryUrl":"%s","repositoryCommit":"%s","toolVersion":"v2.6.0","exitCode":%s}\n' "$repo" "$commit" "$exit_code" > "$GITHUB_WORKSPACE/research/osv-scanner-reports/$slug.meta.json"
          }
          scan_osv axios https://github.com/axios/axios 1a94bdbdf0518f3adbeada510b747aff80847ed7 "$GITHUB_WORKSPACE/targets/axios/package-lock.json"
          scan_osv undici https://github.com/nodejs/undici e960331c83346ce770a7a58d7cfb6afb4aec0ccf "$GITHUB_WORKSPACE/targets/undici/package-lock.json"
          scan_osv npm-cli https://github.com/npm/cli b317f16c80df02ea3628cfa77170d5ae9b59720c "$GITHUB_WORKSPACE/targets/npm-cli/package-lock.json"
          scan_osv marked https://github.com/markedjs/marked eaa1fffb30fa334cc11ab93f1e5aaa1d2b916e7c "$GITHUB_WORKSPACE/targets/marked/package-lock.json"
          scan_osv yargs https://github.com/yargs/yargs b2dbcc538062829bd720f8cbfb6b4765bae6b4b8 "$GITHUB_WORKSPACE/targets/yargs/package-lock.json"
          scan_osv node-red https://github.com/node-red/node-red 935b8d3e12ec8be064f3a72ac6547131f778a7b1 "$GITHUB_WORKSPACE/targets/node-red/package-lock.json"
          scan_osv parse-server https://github.com/parse-community/parse-server 304c1a5d4e752958c7c9b41425fe1ee546111fc6 "$GITHUB_WORKSPACE/targets/parse-server/package-lock.json"
      - name: Generate union candidate manifest
        run: npm run build:candidates -- --reports-dir "$GITHUB_WORKSPACE/research/scan-reports" --external-reports-dir "$GITHUB_WORKSPACE/research/osv-scanner-reports" --out "$GITHUB_WORKSPACE/research/benchmark-candidates.csv"
      - name: Generate OSV-Scanner CVSS baseline scores
        run: npm run build:osv-scores -- --candidates "$GITHUB_WORKSPACE/research/benchmark-candidates.csv" --reports-dir "$GITHUB_WORKSPACE/research/osv-scanner-reports" --out "$GITHUB_WORKSPACE/research/osv-scanner-scores.csv"
      - name: Generate blinded reviewer packets
        run: npm run build:review-packets -- --candidates "$GITHUB_WORKSPACE/research/benchmark-candidates.csv" --out-dir "$GITHUB_WORKSPACE/research/review-packets"
      - name: Write reproducibility manifest
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/research/experiment-manifest.json" <<EOF
          {
            "collectedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "pathguardCommit": "$GITHUB_SHA",
            "nodeVersion": "$(node --version)",
            "npmVersion": "$(npm --version)",
            "osvScannerVersion": "v2.6.0",
            "repositoryCommits": {
              "https://github.com/axios/axios": "1a94bdbdf0518f3adbeada510b747aff80847ed7",
              "https://github.com/nodejs/undici": "e960331c83346ce770a7a58d7cfb6afb4aec0ccf",
              "https://github.com/npm/cli": "b317f16c80df02ea3628cfa77170d5ae9b59720c",
              "https://github.com/markedjs/marked": "eaa1fffb30fa334cc11ab93f1e5aaa1d2b916e7c",
              "https://github.com/yargs/yargs": "b2dbcc538062829bd720f8cbfb6b4765bae6b4b8",
              "https://github.com/node-red/node-red": "935b8d3e12ec8be064f3a72ac6547131f778a7b1",
              "https://github.com/parse-community/parse-server": "304c1a5d4e752958c7c9b41425fe1ee546111fc6"
            },
            "labelStatus": "unreviewed; no ground-truth labels assigned",
            "mappingInventory": "four lodash, three provisional Busboy, and one GraphQL utility mapping",
            "interpretation": "candidate discovery and baseline outputs only; not empirical evaluation results"
          }
          EOF
      - name: Validate candidate review artifact
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("research/experiment-manifest.json","utf8")); const c=fs.readFileSync("research/benchmark-candidates.csv","utf8"); const s=fs.readFileSync("research/osv-scanner-scores.csv","utf8"); const r=fs.readFileSync("research/review-packets/reviewer-1-blinded.csv","utf8"); const a=fs.readFileSync("research/review-packets/adjudication-template.csv","utf8"); if(!a.startsWith("case_id,label,disagreement_notes") || Object.keys(m.repositoryCommits||{}).length!==7 || m.labelStatus!=="unreviewed; no ground-truth labels assigned" || m.mappingInventory!=="four lodash, three provisional Busboy, and one GraphQL utility mapping" || !c.startsWith("case_id,repository_url,commit_sha") || !c.includes("advisory_summary,advisory_references") || !c.includes("discovery_source") || !s.startsWith("case_id,score,flagged") || !r.startsWith("case_id,repository_url,commit_sha") || r.split(String.fromCharCode(10))[0].includes("pathguard_score") || r.split(String.fromCharCode(10))[0].includes("source_assessment")) throw new Error("Benchmark review artifact validation failed");'
      - name: Upload scan reports, baseline scores, and unlabeled candidates
        uses: actions/upload-artifact@v4
        with:
          name: pathguard-public-benchmark-candidates
          path: |
            research/scan-reports/*.json
            research/osv-scanner-reports/*
            research/benchmark-candidates.csv
            research/osv-scanner-scores.csv
            research/experiment-manifest.json
            research/review-packets/*
          if-no-files-found: error
          retention-days: 30
