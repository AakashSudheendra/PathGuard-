name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run evaluate:benchmark -- --reports-dir research/fixtures/scan-reports --labels research/fixtures/sample-labels.csv --external-ranking research/fixtures/sample-external-scores.csv --external-name synthetic-external --out /tmp/pathguard-benchmark-metrics.json --k 2
      - run: node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/pathguard-benchmark-metrics.json','utf8')); if(r.coverage.labelRows!==5 || r.coverage.matchedRows!==4 || r.coverage.unmatchedRows!==1 || r.metrics.length!==4 || r.metrics.some(m=>m.evaluatedCases!==4)) throw new Error('Benchmark evaluator smoke assertions failed');"
      - run: npm run build:candidates -- --reports-dir research/fixtures/scan-reports --out /tmp/pathguard-candidates.csv
      - run: node -e "const fs=require('fs'); const s=fs.readFileSync('/tmp/pathguard-candidates.csv','utf8'); const lines=s.trim().split(String.fromCharCode(10)); if(lines.length<2 || !lines[0].startsWith('case_id,repository_url,commit_sha') || !s.includes('UNREVIEWED candidate') || /,reachable,|,not_reachable,/.test(s)) throw new Error('Candidate manifest smoke assertions failed');"
      - run: npm run build:review-packets -- --candidates /tmp/pathguard-candidates.csv --out-dir /tmp/pathguard-review-packets
      - run: node -e "const fs=require('fs'); const h=fs.readFileSync('/tmp/pathguard-review-packets/reviewer-1-blinded.csv','utf8').split(String.fromCharCode(10))[0]; if(!h.includes('reviewer_label') || h.includes('pathguard_score') || h.includes('source_assessment')) throw new Error('Blinded reviewer packet assertion failed');"
      - run: npm run merge:review-labels -- --candidates research/fixtures/review/candidates.csv --reviewer-1 research/fixtures/review/reviewer-1.csv --reviewer-2 research/fixtures/review/reviewer-2.csv --adjudication research/fixtures/review/adjudication.csv --out /tmp/pathguard-labeled-fixture.csv
      - run: node -e "const fs=require('fs'); const s=fs.readFileSync('/tmp/pathguard-labeled-fixture.csv','utf8'); if(!s.includes('Reviewer One') || !s.includes('Reviewer Two') || !s.includes(',reachable,') || !s.includes('reviewer_1_notes')) throw new Error('Review label merge assertion failed');"
