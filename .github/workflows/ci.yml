name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No npm lockfile is committed yet; enable cache after adding one.
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run evaluate:benchmark -- --report research/fixtures/sample-report.json --labels research/fixtures/sample-labels.csv --out /tmp/pathguard-benchmark-metrics.json --k 2
